<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Shopping System</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

</head>

<body>

<nav>

    <div class="logo">
        <h2>Karan Shop</h2>
    </div>

    <div class="search">

        <input
            type="text"
            id="searchBox"
            placeholder="Search products..."
            onkeyup="searchProduct()">

    </div>

    <div class="cart-icon">

        🛒 Cart
        <span id="cartCount">0</span>

    </div>

</nav>

<header>

    <h1>Premium Online Shopping System</h1>

    <p>Modern E-Commerce Website using HTML, CSS & JavaScript</p>

</header>

<section class="products">

<div class="card">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="Tshirt">

<h2>T-Shirt</h2>

<h3>₹500</h3>

<button onclick="addToCart('T-Shirt',500)">Add to Cart</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500" alt="Jeans">

<h2>Jeans</h2>

<h3>₹1200</h3>

<button onclick="addToCart('Jeans',1200)">Add to Cart</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">

<h2>Shoes</h2>

<h3>₹2000</h3>

<button onclick="addToCart('Shoes',2000)">Add to Cart</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Watch">

<h2>Watch</h2>

<h3>₹1500</h3>

<button onclick="addToCart('Watch',1500)">Add to Cart</button>

</div>

</section>

<section class="cart">

<h2>🛒 Shopping Cart</h2>

<div id="cartItems"></div>

<h3 id="total">Total : ₹0</h3>

<button class="checkout">Checkout</button>

</section>

<script src="script.js"></script>

</body>

</html>
